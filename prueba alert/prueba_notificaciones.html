<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pruebas de notificaciones xd</title>
    <link rel="stylesheet" href="/styles/notifications.css">
    <script defer src="/js/notifications.js"></script>
</head>
<body>
<main>
    <h1>Notificaciones</h1>
    <p>Prueba del funcionamiento de las notify.</p>
    <button onclick="BYPNotify('Paciente registrado correctamente', 'success')">Éxito</button>
    <button onclick="BYPNotify('Contraseña incorrecta', 'error')">Error</button>
    <button onclick="BYPNotify('Completá todos los campos', 'warning')">Advertencia</button>
    <button onclick="BYPNotify('Datos consultados', 'info')">Información</button>
</main>
</body>
</html>
