<div class="phone_container">
    <label for="cellphone_number">Número Actual:</label>
    <select name="cellphone_code" id="cellphone_code">
        <option value="">Seleccione una opción</option>
    </select>
    <input type="text" name="cellphone_number"
    id="cellphone_number" placeholder="99789876"
    inputmode="numeric">
    <span id="cellphone_msg"></span>
</div>
<div class="other_phone_container">
    <label for="other_cellphone_number">Número Nuevo:</label>
    <select name="other_cellphone_code" id="other_cellphone_code">
        <option value="">Seleccione una opción</option>
    </select>
    <input type="text" name="other_cellphone_number"
    id="other_cellphone_number" placeholder="99789876"
    inputmode="numeric">
    <span id="other_cellphone_msg"></span>
</div>
